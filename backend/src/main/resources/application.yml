server:
  port: 8080

spring:
  application:
    name: intelligent-customer
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/intelligent_customer?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework: INFO
    org.mybatis: DEBUG
    com.baomidou.mybatisplus: DEBUG

ollama:
  base-url: http://localhost:11434
  chat-model: qwen2.5:7b
  embedding-model: nomic-embed-text
  temperature: 0.2
  timeout: PT60S

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:faq_store}
  dimension: ${MILVUS_DIMENSION:768}

vanna:
  base-url: ${VANNA_BASE_URL:http://localhost:8081}
  sql-path: ${VANNA_SQL_PATH:/api/v1/sql}
  timeout: ${VANNA_TIMEOUT:PT30S}
  dialect: ${VANNA_DIALECT:mysql}

faq:
  chunk-size: 300
  overlap: 30
