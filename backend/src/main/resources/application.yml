server:
  port: 8080

spring:
  application:
    name: intelligent-customer
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/intelligent_customer?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

ollama:
  base-url: http://localhost:11434
  chat-model: qwen2.5:7b
  embedding-model: nomic-embed-text
  temperature: 0.2
  timeout: PT60S

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:faq_store}
  dimension: ${MILVUS_DIMENSION:768}

faq:
  chunk-size: 300
  overlap: 30
