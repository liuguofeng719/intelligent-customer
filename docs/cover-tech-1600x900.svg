    <text x="120" y="340" font-size="56" font-weight="600">Spring Boot + LangChain4j + Ollama</text>
    <text x="120" y="420" font-size="62" font-weight="600">全链路落地与避坑指南</text>
  </g>

  <g fill="#94A3B8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
